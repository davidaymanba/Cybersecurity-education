ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
LimitRequestBody 2097152

# mod_php + prefork: one process per request. 16 x ~50 MB fits the 1g container limit.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          6
    MaxRequestWorkers        16
    ServerLimit              16
    MaxConnectionsPerChild   1000
</IfModule>

KeepAlive On
KeepAliveTimeout 3
MaxKeepAliveRequests 100
# AI answers can stream for up to ~60s (plus one short rate-limit retry).
Timeout 120

<Directory /var/www/html/public>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Compress text responses, but never the AI event stream (it must flush token by token).
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json image/svg+xml
    SetEnvIfNoCase Request_URI "/app-api/ai/chat/stream$" no-gzip dont-vary
</IfModule>

# Vite assets have content hashes in their file names: cache them for a year.
<LocationMatch "^/build/assets/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>
<FilesMatch "^favicon\.(ico|svg)$">
    Header set Cache-Control "public, max-age=604800"
</FilesMatch>
