name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, zip, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Build front-end assets (Blade views use @vite)
        run: npm ci --no-audit --no-fund && npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test
        env:
          # Tests fake every AI call; make sure no real provider key is ever used in CI.
          GROQ_API_KEY: ''
          GROQ_SINGLE_API_KEY: ''
          GROQ_MULTI_API_KEY: ''
          OPENAI_API_KEY: ''
